---
all:
  children:
    service_nodes:
      vars:
        fleet_proxy_backend: replicas
      hosts:
        node_a:
          ansible_connection: local
          fleet_compose_project_name: fleet-ci-a
          fleet_compose_env:
            FLEET_CI_PORT: '18101'
          fleet_health_url: http://127.0.0.1:18101/
        node_b:
          ansible_connection: local
          fleet_compose_project_name: fleet-ci-b
          fleet_compose_env:
            FLEET_CI_PORT: '18102'
          fleet_health_url: http://127.0.0.1:18102/
    load_balancers:
      hosts:
        proxy_ci:
          ansible_connection: local
          fleet_haproxy_socket: /tmp/fleet-ci-haproxy.sock
