global
  maxconn 256
  stats socket /tmp/fleet-ci-haproxy.sock mode 600 level admin
defaults
  mode http
  timeout connect 2s
  timeout client 10s
  timeout server 10s
frontend local_test
  bind 127.0.0.1:19080
  default_backend replicas
backend replicas
  option httpchk GET /
  server node_a 127.0.0.1:18101 check inter 500ms fall 2 rise 2
  server node_b 127.0.0.1:18102 check inter 500ms fall 2 rise 2
